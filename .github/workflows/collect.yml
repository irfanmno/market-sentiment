# Forward collector (see src/collect.py and src/collect_minute.py).
# Data is committed to the separate `collector-data` branch so `main` stays code-only.
#
# Cost: free and unlimited minutes on a PUBLIC repo. On a PRIVATE repo the free plan gives
# 2,000 min/month, and every run bills >= 1 min, so use "*/30" there (~1,500 min/month).
# GitHub may delay scheduled runs at busy times; runs/YYYY-MM.csv records the real times.
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"   # news feeds, every 10 min
    - cron: "30 23 * * *"    # minute bars, daily after the US close
  workflow_dispatch:         # manual "Run workflow" button (runs both)

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COLLECTOR_DIR: data/collector
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (create it on the first run)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin collector-data; then
            git worktree add data/collector FETCH_HEAD
            git -C data/collector switch -c collector-data
          else
            git worktree add --orphan -b collector-data data/collector
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: News feeds
        run: |
          pip install -q -r requirements-collector.txt
          python src/collect.py

      - name: Minute bars (daily run or manual)
        if: github.event.schedule == '30 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -q pandas yfinance
          python src/collect_minute.py

      - name: Commit and push data
        working-directory: data/collector
        run: |
          git add -A
          git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:collector-data && exit 0
            git pull --rebase origin collector-data || true
          done
          exit 1
